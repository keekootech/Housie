<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Housie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#160B2E;
  --night2:#241247;
  --panel:#311A5E;
  --gold:#FFC531;
  --rose:#FF3D7F;
  --lime:#8CE84B;
  --sky:#3FC5FF;
  --paper:#FFF6E0;
  --ink:#20103F;
  --dim:#A18FCB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:
    radial-gradient(ellipse at 50% 0%, #3A1C6B 0%, transparent 60%),
    var(--night);
  color:#F6EEFF;
  font-family:Nunito,system-ui,sans-serif;
  font-weight:700;
  padding:10px 12px 34px;
  max-width:540px;margin:0 auto;
  min-height:100vh;
}
body.shake{animation:shake .5s}
@keyframes shake{
  10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
h1{
  font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:23px;margin:0;
  color:var(--gold);text-shadow:0 3px 0 #B87700, 0 5px 12px rgba(255,197,49,.35);
  letter-spacing:.5px;flex:1;
}
.chip{
  background:var(--panel);border-radius:999px;padding:5px 11px;
  font-size:12px;color:var(--dim);white-space:nowrap;
}
.chip b{color:var(--gold)}

/* ---------- stage ---------- */
.stage{
  position:relative;
  background:linear-gradient(170deg,#3C1E75,#26124D);
  border-radius:22px;
  border:2px solid rgba(255,197,49,.25);
  padding:12px 12px 14px;
  overflow:hidden;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 12%, rgba(255,197,49,.16), transparent 55%);
}

/* drum */
.drum{
  height:52px;position:relative;margin:0 auto 4px;width:150px;
}
.drum i{
  position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #fff9, transparent 55%), var(--c);
  animation:tumble 1.4s infinite ease-in-out;
}
@keyframes tumble{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(9px,-11px) rotate(90deg)}
  50%{transform:translate(-6px,7px) rotate(180deg)}
  75%{transform:translate(11px,5px) rotate(280deg)}
}
.drum.spin i{animation-duration:.28s}
.drum-lip{
  position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  width:120px;height:10px;border-radius:0 0 40px 40px;
  background:rgba(255,255,255,.09);
}

/* the ball */
.ballwrap{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.ball{
  width:126px;height:126px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:Bungee,Impact,sans-serif;font-size:56px;color:var(--ink);
  background:radial-gradient(circle at 34% 26%, #fff 0%, var(--bc,#FFC531) 46%, #C98A00 100%);
  box-shadow:0 12px 0 rgba(0,0,0,.3), inset 0 -8px 14px rgba(0,0,0,.22);
  position:relative;
}
.ball.empty{
  background:none;border:4px dashed rgba(255,255,255,.14);box-shadow:none;
  color:rgba(255,255,255,.18);font-size:34px;
}
.ball.drop{animation:drop .75s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{
  0%{transform:translateY(-190px) scale(.35) rotate(-220deg);opacity:0}
  55%{transform:translateY(14px) scale(1.14) rotate(8deg);opacity:1}
  72%{transform:translateY(-16px) scale(.96) rotate(-4deg)}
  100%{transform:translateY(0) scale(1) rotate(0)}
}
.ball.rolling{animation:rollpick .09s infinite linear}
@keyframes rollpick{0%{transform:scale(.94) rotate(-6deg)}50%{transform:scale(1.02) rotate(6deg)}100%{transform:scale(.94) rotate(-6deg)}}
.halo{
  position:absolute;width:126px;height:126px;border-radius:50%;
  border:3px solid var(--gold);opacity:0;
}
.halo.go{animation:halo .8s ease-out}
@keyframes halo{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}

.callline{
  text-align:center;font-family:Bungee,sans-serif;font-size:15px;
  color:#FFE6A8;min-height:20px;letter-spacing:.4px;position:relative;
}
.callline.in{animation:slidein .45s ease-out}
@keyframes slidein{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.trail{display:flex;gap:6px;justify-content:center;margin-top:10px;min-height:30px}
.trail b{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;color:var(--ink);
  background:radial-gradient(circle at 34% 28%, #fff8, transparent 60%), var(--c);
  animation:slidein .4s ease-out;
}

/* ---------- controls ---------- */
.controls{display:flex;gap:8px;margin:12px 0 4px}
button{
  font-family:Nunito,sans-serif;font-weight:900;font-size:15px;
  border:none;border-radius:14px;padding:14px 10px;cursor:pointer;
  background:var(--panel);color:#E6D7FF;flex:1;
  box-shadow:0 4px 0 rgba(0,0,0,.35);
  transition:transform .08s, box-shadow .08s;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.go{background:linear-gradient(180deg,#FF5A93,var(--rose));color:#fff;box-shadow:0 4px 0 #A81B4E}
.go:disabled{background:var(--panel);color:#6B57A0;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.seg{display:flex;background:var(--night2);border-radius:14px;padding:4px;gap:4px;flex:1}
.seg button{background:transparent;color:var(--dim);padding:9px 4px;font-size:14px;box-shadow:none}
.seg button:active{transform:none}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.mini{flex:0 0 50px;padding:10px 0;font-size:18px}

#voice{
  width:100%;margin-bottom:8px;display:none;
  background:var(--night2);color:var(--dim);border:none;border-radius:12px;
  padding:11px 12px;font-family:Nunito,sans-serif;font-weight:700;font-size:13.5px;
}
/* ---------- ticket ---------- */
.ticket{
  background:var(--paper);border-radius:16px;padding:8px;margin-top:14px;
  box-shadow:0 8px 0 rgba(0,0,0,.35);
  background-image:radial-gradient(rgba(32,16,63,.05) 1px, transparent 1px);
  background-size:9px 9px;
}
table{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
td{height:46px;text-align:center;border-radius:9px;font-weight:900;font-size:18px;color:var(--ink)}
td.blank{background:rgba(32,16,63,.06)}
td.num{background:#FFE9B0;cursor:pointer;position:relative;user-select:none}
td.num:active{transform:scale(.9)}
td.dab{color:#fff;background:var(--rose);animation:dab .35s cubic-bezier(.34,1.56,.64,1)}
td.dab.good{background:var(--lime);color:#173B00}
@keyframes dab{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
td.live{animation:live 1s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(63,197,255,.9)}50%{box-shadow:0 0 0 7px rgba(63,197,255,0)}}

/* ---------- claims ---------- */
.claims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.claims button{text-align:left;padding:12px 10px;font-size:14.5px;position:relative;overflow:hidden}
.claims button span{display:block;font-size:11.5px;font-weight:700;color:var(--dim);margin-top:2px}
.claims button.close{background:linear-gradient(180deg,#4B2A8C,var(--panel));box-shadow:0 4px 0 #1B0E36}
.claims button.close span{color:var(--sky)}
.claims button.ready{background:linear-gradient(180deg,#B6FF6A,var(--lime));color:#173B00;box-shadow:0 4px 0 #4E8F1C;animation:beg .9s infinite}
.claims button.ready span{color:#2E6300}
@keyframes beg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.claims button.won{background:linear-gradient(180deg,#FFD75E,var(--gold));color:var(--ink);box-shadow:0 4px 0 #A87400;animation:none}
.claims button.won span{color:#6B4700}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);
  background:var(--gold);color:var(--ink);font-weight:900;font-size:15px;
  padding:13px 22px;border-radius:999px;z-index:60;max-width:88vw;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.35);
}
.toast.show{transform:translate(-50%,0);transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.toast.bad{background:var(--rose);color:#fff;box-shadow:0 6px 0 #A81B4E}

details{margin-top:16px}
summary{cursor:pointer;color:var(--dim);font-size:13.5px;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.board div{font-size:11px;text-align:center;padding:6px 0;border-radius:6px;background:var(--night2);color:#61509A}
.board div.hit{background:var(--gold);color:var(--ink);animation:dab .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <h1>Housie Night</h1>
  <div class="chip" id="chip"><b>90</b> in the bag</div>
</div>

<div class="stage">
  <div class="drum" id="drum"></div>
  <div class="ballwrap">
    <div class="halo" id="halo"></div>
    <div class="ball empty" id="ball">?</div>
  </div>
  <div class="callline" id="callline">Tap start — good luck</div>
  <div class="trail" id="trail"></div>
</div>

<div class="row" style="margin-top:12px">
  <div class="seg" role="group" aria-label="Calling mode">
    <button id="mAuto" aria-pressed="true">Auto call</button>
    <button id="mHost" aria-pressed="false">I'll call</button>
  </div>
  <button class="mini" id="snd" aria-label="Sound">🔊</button>
</div>
<select id="voice" aria-label="Caller voice"></select>

<div class="controls">
  <button class="go" id="main">Start game</button>
  <button id="fresh">New ticket</button>
</div>

<div class="ticket"><table id="tk"><tbody></tbody></table></div>

<div class="claims" id="claims"></div>

<details>
  <summary>▸ Show the full board</summary>
  <div class="board" id="board"></div>
</details>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script>
/* ================= ticket generation ================= */
const COLORS=['#FFC531','#FF3D7F','#8CE84B','#3FC5FF','#C77DFF','#FF8A3D'];
const colRange=c=>c===0?[1,9]:c===8?[80,90]:[c*10,c*10+9];
function makeCounts(){
  const k=[1,1,1,1,1,1,1,1,1];
  for(let i=0;i<6;i++){const o=[];for(let c=0;c<9;c++)if(k[c]<3)o.push(c);
    k[o[Math.floor(Math.random()*o.length)]]++;}
  return k;
}
const SUB={1:[[0],[1],[2]],2:[[0,1],[0,2],[1,2]],3:[[0,1,2]]};
function place(k){
  const rows=[5,5,5],g=Array.from({length:3},()=>Array(9).fill(false));
  (function s(c){
    if(c===9)return true;
    for(const set of SUB[k[c]].slice().sort(()=>Math.random()-.5)){
      if(set.some(r=>rows[r]===0))continue;
      set.forEach(r=>{rows[r]--;g[r][c]=true});
      if(s(c+1))return true;
      set.forEach(r=>{rows[r]++;g[r][c]=false});
    }
    return false;
  })(0);
  return rows.every(r=>r===0)?g:null;
}
function newTicket(){
  let g=null;while(!g)g=place(makeCounts());
  const t=Array.from({length:3},()=>Array(9).fill(null));
  for(let c=0;c<9;c++){
    const[lo,hi]=colRange(c),p=[];for(let n=lo;n<=hi;n++)p.push(n);
    p.sort(()=>Math.random()-.5);
    const need=[0,1,2].filter(r=>g[r][c]);
    const pick=p.slice(0,need.length).sort((a,b)=>a-b);
    need.forEach((r,i)=>t[r][c]=pick[i]);
  }
  return t;
}

/* ================= flavour ================= */
const NICK={
 1:{e:"Ek ka ekka",h:"एक का इक्का"},
 2:{e:"Do ki jodi",h:"दो की जोड़ी"},
 3:{e:"Teen ka tikka",h:"तीन का तिक्का"},
 4:{e:"Char ka chauka",h:"चार का चौका"},
 5:{e:"Paanch ka panja",h:"पाँच का पंजा"},
 6:{e:"Chhakka!",h:"छक्का"},
 7:{e:"Saat phere",h:"सात फेरे"},
 8:{e:"Garden gate"},
 9:{e:"Nau do gyarah",h:"नौ दो ग्यारह"},
 10:{e:"Dus ka dum",h:"दस का दम"},
 11:{e:"Two sticks, do lakdi",h:"दो लकड़ी"},
 12:{e:"Baarah baj gaye",h:"बारह बज गए"},
 13:{e:"Unlucky for some"},
 14:{e:"Chaudah saal ka vanvaas",h:"चौदह साल का वनवास"},
 15:{e:"Independence Day"},
 16:{e:"Sweet sixteen"},
 18:{e:"Ab vote daal sakte ho",h:"अब वोट डाल सकते हो"},
 19:{e:"Ek kam bees",h:"एक कम बीस"},
 21:{e:"Ghar ki chaabi",h:"घर की चाबी"},
 22:{e:"Two ducks, do battakh",h:"दो बत्तख"},
 25:{e:"Silver jubilee"},
 26:{e:"Republic Day"},
 30:{e:"Dirty thirty"},
 33:{e:"All the threes"},
 36:{e:"Chhattis ka aankda",h:"छत्तीस का आंकड़ा"},
 40:{e:"Ali Baba ke chalis chor",h:"अली बाबा के चालीस चोर"},
 44:{e:"Do chashme",h:"दो चश्मे"},
 45:{e:"Aadha raasta",h:"आधा रास्ता"},
 50:{e:"Half century"},
 51:{e:"Shagun ka lifafa",h:"शगुन का लिफाफा"},
 55:{e:"Snakes alive"},
 56:{e:"Chhappan bhog",h:"छप्पन भोग"},
 60:{e:"Retirement ki age",h:"रिटायरमेंट की उम्र"},
 64:{e:"Chausath kalayein",h:"चौंसठ कलाएँ"},
 66:{e:"Chhakke pe chhakka",h:"छक्के पे छक्का"},
 69:{e:"Ulta pulta",h:"उल्टा पुल्टा"},
 75:{e:"Platinum jubilee"},
 77:{e:"Do jhande",h:"दो झंडे"},
 80:{e:"Gandhi's breakfast"},
 88:{e:"Two fat ladies, do moti aunty",h:"दो मोटी आंटी"},
 89:{e:"Bas ek aur",h:"बस एक और"},
 90:{e:"Top of the house"}
};
const HINDI_NUM=["","एक","दो","तीन","चार","पाँच","छह","सात","आठ","नौ","दस","ग्यारह","बारह","तेरह","चौदह","पंद्रह","सोलह","सत्रह","अठारह","उन्नीस","बीस"];

/* ================= sound ================= */
let AC=null,sound=true;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function blip(f,d,type,vol){
  if(!sound)return;
  const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.16,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(d||.14));
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.14));
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.28,'square',.13),i*95)); }
function buzz(){ blip(150,.22,'sawtooth',.14); setTimeout(()=>blip(110,.26,'sawtooth',.14),110); }
/* voice picking — prefer Hindi, then Indian English, then anything */
let voices=[],voice=null;
function rank(v){
  const l=(v.lang||'').toLowerCase();
  if(l.startsWith('hi'))return 0;
  if(l==='en-in'||l.startsWith('en-in'))return 1;
  if(/india|hindi|lekha|rishi|veena|kalpana|heera/i.test(v.name))return 1;
  if(l.startsWith('en'))return 2;
  return 3;
}
function loadVoices(){
  if(!window.speechSynthesis)return;
  voices=speechSynthesis.getVoices().slice().sort((a,b)=>rank(a)-rank(b));
  if(!voices.length)return;
  const sel=$('voice');
  sel.innerHTML=voices.map((v,i)=>
    `<option value="${i}">${v.name.replace(/Microsoft |Google /,'')} · ${v.lang}</option>`).join('');
  if(!voice){voice=voices[0];sel.value=0;}
  sel.style.display=voices.length>1?'block':'none';
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}

function speak(n){
  if(!sound||!window.speechSynthesis)return;
  const nk=NICK[n],hindi=voice&&(voice.lang||'').toLowerCase().startsWith('hi');
  let line;
  if(hindi){
    const num=n<=20?HINDI_NUM[n]:String(n);
    line=nk?`${nk.h||nk.e}, ${num}`:`${num}`;
  }else{
    const digits=n<10?`Number ${n}`:`${String(n)[0]} ${String(n)[1]}, ${n}`;
    line=nk?`${nk.e}, ${n}`:digits;
  }
  const u=new SpeechSynthesisUtterance(line);
  if(voice){u.voice=voice;u.lang=voice.lang;}
  u.rate=hindi?.92:.95;u.pitch=1.05;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

/* ================= confetti ================= */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
let bits=[];
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}
sizeCv();addEventListener('resize',sizeCv);
function burst(n,power){
  for(let i=0;i<n;i++)bits.push({
    x:innerWidth/2,y:innerHeight*.42,
    vx:(Math.random()-.5)*(power||13),vy:(Math.random()-.9)*(power||13),
    r:Math.random()*6+3,c:COLORS[i%COLORS.length],a:1,sp:Math.random()*.3-.15,rot:Math.random()*6
  });
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.a>0);
  bits.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;b.vy+=.32;b.vx*=.99;b.a-=.008;b.rot+=b.sp;
    cx.save();cx.globalAlpha=Math.max(b.a,0);cx.translate(b.x,b.y);cx.rotate(b.rot);
    cx.fillStyle=b.c;cx.fillRect(-b.r,-b.r/2,b.r*2,b.r);cx.restore();
  });
  requestAnimationFrame(loop);
})();

/* ================= state ================= */
let ticket,marked,called,pool,timer=null,running=false,auto=true,rolling=false;
const PRIZES=[
 {id:'jaldi5',n:'Jaldi 5',h:'First five marks'},
 {id:'top',n:'Top line',h:'All of row 1'},
 {id:'mid',n:'Middle line',h:'All of row 2'},
 {id:'bot',n:'Bottom line',h:'All of row 3'},
 {id:'corner',n:'Four corners',h:'The four ends'},
 {id:'full',n:'Full housie',h:'Every number'}
];
let won={};
const $=i=>document.getElementById(i);
const rowNums=r=>ticket[r].filter(n=>n!==null);
function need(id){
  if(id==='top')return rowNums(0);
  if(id==='mid')return rowNums(1);
  if(id==='bot')return rowNums(2);
  if(id==='full')return [0,1,2].flatMap(rowNums);
  if(id==='corner'){const t=rowNums(0),b=rowNums(2);return[t[0],t.at(-1),b[0],b.at(-1)];}
  return [];
}

/* ================= render ================= */
function drum(){
  const d=$('drum');d.innerHTML='<div class="drum-lip"></div>';
  for(let i=0;i<7;i++){
    const b=document.createElement('i');
    b.style.setProperty('--c',COLORS[i%COLORS.length]);
    b.style.left=(i*19+6)+'px';b.style.top=(i%3*11+6)+'px';
    b.style.animationDelay=(i*.13)+'s';
    d.appendChild(b);
  }
}
function drawTicket(){
  const tb=$('tk').querySelector('tbody');tb.innerHTML='';
  ticket.forEach(row=>{
    const tr=document.createElement('tr');
    row.forEach(n=>{
      const td=document.createElement('td');
      if(n===null)td.className='blank';
      else{
        td.className='num';td.textContent=n;
        if(marked.has(n)){td.classList.add('dab');if(called.has(n))td.classList.add('good');}
        else if(called.has(n))td.classList.add('live');
        td.onclick=()=>{
          if(marked.has(n)){marked.delete(n);blip(300,.07);}
          else{marked.add(n);blip(called.has(n)?880:420,.1);}
          drawTicket();drawClaims();
        };
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}
function drawClaims(){
  const w=$('claims');w.innerHTML='';
  PRIZES.forEach(p=>{
    const b=document.createElement('button');
    let sub=p.h,cls='';
    if(won[p.id]){sub='Won! 🏆';cls='won';}
    else{
      const req=p.id==='jaldi5'?null:need(p.id);
      if(p.id==='jaldi5'){
        const g=[...marked].filter(n=>called.has(n)).length;
        if(g>=5){sub='Claim it now!';cls='ready';}
        else sub=`${g} of 5 marked`;
      }else{
        const left=req.filter(n=>!called.has(n)).length;
        const unm=req.filter(n=>called.has(n)&&!marked.has(n)).length;
        if(left===0&&unm===0){sub='Claim it now!';cls='ready';}
        else if(left===0){sub=`${unm} left to mark`;cls='close';}
        else if(left<=2){sub=`${left} to go!`;cls='close';}
        else sub=`${left} still in the bag`;
      }
    }
    b.innerHTML=`${p.n}<span>${sub}</span>`;
    if(cls)b.classList.add(cls);
    if(won[p.id])b.disabled=true;
    b.onclick=()=>claim(p);
    w.appendChild(b);
  });
}
function drawBoard(){
  const b=$('board');b.innerHTML='';
  for(let n=1;n<=90;n++){
    const d=document.createElement('div');d.textContent=n;
    if(called.has(n))d.className='hit';
    b.appendChild(d);
  }
}
function drawTrail(){
  const last=[...called].slice(-5,-1).reverse();
  $('trail').innerHTML=last.map((n,i)=>`<b style="--c:${COLORS[n%COLORS.length]}">${n}</b>`).join('');
  $('chip').innerHTML=`<b>${pool.length}</b> in the bag`;
}
function toast(m,bad){
  const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2500);
}

/* ================= calling ================= */
function callNext(){
  if(rolling)return;
  if(!pool.length){stop();toast('Bag is empty!');return;}
  rolling=true;
  const ball=$('ball'),dr=$('drum');
  dr.classList.add('spin');
  ball.classList.remove('empty','drop');
  ball.classList.add('rolling');
  $('callline').textContent='...';
  let ticks=0;
  const spin=setInterval(()=>{
    const fake=pool[Math.floor(Math.random()*pool.length)];
    ball.textContent=fake;
    ball.style.setProperty('--bc',COLORS[fake%COLORS.length]);
    blip(500+ticks*40,.04,'square',.06);
    ticks++;
  },70);

  setTimeout(()=>{
    clearInterval(spin);
    dr.classList.remove('spin');
    const n=pool.pop();
    called.add(n);
    ball.classList.remove('rolling');
    ball.textContent=n;
    ball.style.setProperty('--bc',COLORS[n%COLORS.length]);
    void ball.offsetWidth;ball.classList.add('drop');
    const h=$('halo');h.classList.remove('go');void h.offsetWidth;h.classList.add('go');
    blip(660,.18,'triangle',.18);setTimeout(()=>blip(990,.2,'triangle',.14),90);
    const cl=$('callline');cl.textContent=NICK[n]?NICK[n].e:`Number ${n}`;
    cl.classList.remove('in');void cl.offsetWidth;cl.classList.add('in');
    speak(n);
    const mine=ticket.flat().includes(n);
    if(mine)burst(14,7);
    drawTrail();drawBoard();drawTicket();drawClaims();
    rolling=false;
  },900);
}

function start(){running=true;$('main').textContent=auto?'Pause':'Call next number';
  if(auto)timer=setInterval(callNext,6500);callNext();}
function stop(){running=false;clearInterval(timer);timer=null;$('main').textContent='Resume';}

$('main').onclick=()=>{ac();if(!running)start();else if(auto)stop();else callNext();};
$('fresh').onclick=()=>{reset();toast('New ticket, new luck');};
$('mAuto').onclick=()=>mode(true);
$('mHost').onclick=()=>mode(false);
function mode(a){
  auto=a;$('mAuto').setAttribute('aria-pressed',a);$('mHost').setAttribute('aria-pressed',!a);
  clearInterval(timer);timer=null;
  if(running){if(a)timer=setInterval(callNext,6500);$('main').textContent=a?'Pause':'Call next number';}
}
$('voice').onchange=e=>{
  voice=voices[e.target.value];
  const s=sound;sound=true;speak(88);sound=s;
};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';
  if(!sound&&window.speechSynthesis)speechSynthesis.cancel();};

/* ================= claims ================= */
function claim(p){
  if(!called.size){toast('Nothing called yet',true);buzz();return;}
  if(p.id==='jaldi5'){
    const good=[...marked].filter(n=>called.has(n)).length;
    if(good>=5)win(p);else{toast(`Only ${good} correct marks — bogey!`,true);buzz();}
    return;
  }
  const req=need(p.id),miss=req.filter(n=>!called.has(n));
  if(miss.length){toast(`Bogey! ${miss.length} still in the bag`,true);buzz();
    document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);return;}
  const un=req.filter(n=>!marked.has(n));
  if(un.length){toast('Mark them on your ticket first',true);buzz();return;}
  win(p);
}
function win(p){
  won[p.id]=true;drawClaims();
  toast(`${p.n} — verified! 🎉`);
  fanfare();burst(90,16);
  if(p.id==='full'){
    stop();$('callline').textContent='HOUSIE! Game over';
    setTimeout(()=>burst(120,20),400);setTimeout(()=>burst(120,20),900);
    document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);
  }
}

/* ================= reset ================= */
function reset(){
  clearInterval(timer);timer=null;running=false;rolling=false;
  ticket=newTicket();marked=new Set();called=new Set();won={};
  pool=[];for(let n=1;n<=90;n++)pool.push(n);pool.sort(()=>Math.random()-.5);
  const b=$('ball');b.className='ball empty';b.textContent='?';
  $('callline').textContent='Tap start — good luck';
  $('main').textContent='Start game';
  drum();drawTicket();drawClaims();drawBoard();drawTrail();
}
reset();
</script>
