<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Housie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#160B2E;--night2:#241247;--panel:#311A5E;
  --gold:#FFC531;--rose:#FF3D7F;--lime:#8CE84B;--sky:#3FC5FF;
  --paper:#FFF6E0;--ink:#20103F;--dim:#A18FCB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse at 50% 0%, #3A1C6B 0%, transparent 60%),var(--night);
  color:#F6EEFF;font-family:Nunito,system-ui,sans-serif;font-weight:700;
  padding:10px 12px 34px;max-width:540px;margin:0 auto;min-height:100vh;
}
body.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.screen{display:none}.screen.on{display:block}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:23px;margin:0;
  color:var(--gold);text-shadow:0 3px 0 #B87700,0 5px 12px rgba(255,197,49,.35);flex:1}
.chip{background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--gold)}

/* ---------- home ---------- */
.hero{text-align:center;padding:26px 10px 18px}
.hero .big{font-family:Bungee,sans-serif;font-size:38px;line-height:1.05;color:var(--gold);
  text-shadow:0 4px 0 #B87700,0 8px 20px rgba(255,197,49,.3)}
.hero p{color:var(--dim);font-size:14.5px;margin:8px 0 0}
input{
  width:100%;background:var(--night2);border:2px solid var(--panel);border-radius:14px;
  padding:15px 14px;color:#fff;font-family:Nunito;font-weight:900;font-size:16px;margin-bottom:10px;
}
input::placeholder{color:#6B57A0}
input:focus{outline:none;border-color:var(--sky)}
#codeIn{text-align:center;font-family:Bungee,sans-serif;font-size:30px;letter-spacing:10px;text-indent:10px}
.hint{color:var(--dim);font-size:12.5px;text-align:center;margin:2px 0 14px;font-weight:700}

button{font-family:Nunito;font-weight:900;font-size:15px;border:none;border-radius:14px;
  padding:15px 10px;cursor:pointer;background:var(--panel);color:#E6D7FF;flex:1;width:100%;
  box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;margin-bottom:9px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.go{background:linear-gradient(180deg,#FF5A93,var(--rose));color:#fff;box-shadow:0 4px 0 #A81B4E}
.gold{background:linear-gradient(180deg,#FFD75E,var(--gold));color:var(--ink);box-shadow:0 4px 0 #A87400}
button:disabled{opacity:.5}
.ghost{background:transparent;box-shadow:none;color:var(--dim);font-size:13.5px;padding:10px}
.rowb{display:flex;gap:9px}.rowb button{margin-bottom:9px}

/* ---------- lobby ---------- */
.codebox{background:linear-gradient(170deg,#3C1E75,#26124D);border:2px dashed rgba(255,197,49,.4);
  border-radius:20px;padding:18px;text-align:center;margin-bottom:12px}
.codebox .lbl{color:var(--dim);font-size:12.5px;letter-spacing:1px}
.codebox .code{font-family:Bungee,sans-serif;font-size:46px;color:var(--gold);letter-spacing:8px;text-indent:8px;margin:4px 0}
.plist{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.plist span{background:var(--panel);border-radius:999px;padding:8px 13px;font-size:13.5px;animation:pop .3s}
.plist span.me{background:var(--gold);color:var(--ink)}
.plist span.host::after{content:" 👑"}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.wait{text-align:center;color:var(--dim);font-size:14px;padding:14px 0}
.wait b{color:var(--gold)}

/* ---------- stage ---------- */
.stage{position:relative;background:linear-gradient(170deg,#3C1E75,#26124D);border-radius:22px;
  border:2px solid rgba(255,197,49,.25);padding:12px 12px 14px;overflow:hidden}
.drum{height:52px;position:relative;margin:0 auto 4px;width:150px}
.drum i{position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff9,transparent 55%),var(--c);
  animation:tumble 1.4s infinite ease-in-out}
@keyframes tumble{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(9px,-11px) rotate(90deg)}
50%{transform:translate(-6px,7px) rotate(180deg)}75%{transform:translate(11px,5px) rotate(280deg)}}
.drum.spin i{animation-duration:.28s}
.drum-lip{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:120px;height:10px;
  border-radius:0 0 40px 40px;background:rgba(255,255,255,.09)}
.ballwrap{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.ball{width:126px;height:126px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Bungee,sans-serif;font-size:56px;color:var(--ink);
  background:radial-gradient(circle at 34% 26%,#fff 0%,var(--bc,#FFC531) 46%,#C98A00 100%);
  box-shadow:0 12px 0 rgba(0,0,0,.3),inset 0 -8px 14px rgba(0,0,0,.22)}
.ball.empty{background:none;border:4px dashed rgba(255,255,255,.14);box-shadow:none;color:rgba(255,255,255,.18);font-size:34px}
.ball.drop{animation:drop .75s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{0%{transform:translateY(-190px) scale(.35) rotate(-220deg);opacity:0}
55%{transform:translateY(14px) scale(1.14) rotate(8deg);opacity:1}
72%{transform:translateY(-16px) scale(.96) rotate(-4deg)}100%{transform:translateY(0) scale(1) rotate(0)}}
.ball.rolling{animation:rollpick .09s infinite linear}
@keyframes rollpick{0%{transform:scale(.94) rotate(-6deg)}50%{transform:scale(1.02) rotate(6deg)}100%{transform:scale(.94) rotate(-6deg)}}
.halo{position:absolute;width:126px;height:126px;border-radius:50%;border:3px solid var(--gold);opacity:0}
.halo.go2{animation:halo .8s ease-out}
@keyframes halo{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.callline{text-align:center;font-family:Bungee,sans-serif;font-size:15px;color:#FFE6A8;min-height:20px}
.callline.in{animation:slidein .45s ease-out}
@keyframes slidein{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.trail{display:flex;gap:6px;justify-content:center;margin-top:10px;min-height:30px}
.trail b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink);
  background:radial-gradient(circle at 34% 28%,#fff8,transparent 60%),var(--c);animation:slidein .4s ease-out}

.controls{display:flex;gap:8px;margin:12px 0 4px}
.seg{display:flex;background:var(--night2);border-radius:14px;padding:4px;gap:4px;flex:1}
.seg button{background:transparent;color:var(--dim);padding:9px 4px;font-size:14px;box-shadow:none;margin:0}
.seg button:active{transform:none}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.mini{flex:0 0 50px;width:50px;padding:11px 0;font-size:18px;margin:0}
#voice{width:100%;margin-bottom:8px;display:none;background:var(--night2);color:var(--dim);
  border:none;border-radius:12px;padding:11px 12px;font-family:Nunito;font-weight:700;font-size:13.5px}

.ticket{background:var(--paper);border-radius:16px;padding:8px;margin-top:14px;
  box-shadow:0 8px 0 rgba(0,0,0,.35);
  background-image:radial-gradient(rgba(32,16,63,.05) 1px,transparent 1px);background-size:9px 9px}
table{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
td{height:46px;text-align:center;border-radius:9px;font-weight:900;font-size:18px;color:var(--ink)}
td.blank{background:rgba(32,16,63,.06)}
td.num{background:#FFE9B0;cursor:pointer;user-select:none}
td.num:active{transform:scale(.9)}
td.dab{color:#fff;background:var(--rose);animation:dab .35s cubic-bezier(.34,1.56,.64,1)}
td.dab.good{background:var(--lime);color:#173B00}
@keyframes dab{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
td.live{animation:live 1s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(63,197,255,.9)}50%{box-shadow:0 0 0 7px rgba(63,197,255,0)}}

.claims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.claims button{text-align:left;padding:12px 10px;font-size:14.5px;margin:0}
.claims button span{display:block;font-size:11.5px;font-weight:700;color:var(--dim);margin-top:2px}
.claims button.close{background:linear-gradient(180deg,#4B2A8C,var(--panel));box-shadow:0 4px 0 #1B0E36}
.claims button.close span{color:var(--sky)}
.claims button.ready{background:linear-gradient(180deg,#B6FF6A,var(--lime));color:#173B00;box-shadow:0 4px 0 #4E8F1C;animation:beg .9s infinite}
.claims button.ready span{color:#2E6300}
@keyframes beg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.claims button.won{background:linear-gradient(180deg,#FFD75E,var(--gold));color:var(--ink);box-shadow:0 4px 0 #A87400;animation:none}
.claims button.won span{color:#6B4700}
.claims button.gone{opacity:.45;animation:none}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--gold);
  color:var(--ink);font-weight:900;font-size:15px;padding:13px 22px;border-radius:999px;z-index:60;
  max-width:88vw;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0);transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.toast.bad{background:var(--rose);color:#fff;box-shadow:0 6px 0 #A81B4E}

details{margin-top:16px}
summary{cursor:pointer;color:var(--dim);font-size:13.5px;list-style:none;padding:6px 0}
summary::-webkit-details-marker{display:none}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.board div{font-size:11px;text-align:center;padding:6px 0;border-radius:6px;background:var(--night2);color:#61509A}
.board div.hit{background:var(--gold);color:var(--ink);animation:dab .3s}

/* ---------- debug ---------- */
#dbg{position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:#000C;
  color:#8CE84B;font-family:ui-monospace,monospace;font-size:11px;font-weight:400;
  padding:8px 10px 30px;z-index:70;display:none;white-space:pre-wrap;line-height:1.4}
#dbg .err{color:#FF6B8A}
#dbgBtn{position:fixed;right:8px;bottom:8px;width:38px;height:38px;padding:0;border-radius:50%;
  background:#0008;color:#8CE84B;font-size:15px;z-index:71;box-shadow:none;margin:0;opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen on" id="sHome">
  <div class="hero">
    <div class="big">HOUSIE<br>NIGHT</div>
    <p>Ek phone, poora khandaan</p>
  </div>
  <input id="nameIn" placeholder="Your name" maxlength="12" autocomplete="off">
  <button class="go" id="bHost">Host a game</button>
  <div class="rowb">
    <input id="codeIn" placeholder="CODE" maxlength="4" autocapitalize="characters" autocomplete="off" style="margin-bottom:9px">
  </div>
  <button class="gold" id="bJoin">Join game</button>
  <button class="ghost" id="bSolo">or play solo practice</button>
  <div class="hint" id="netHint"></div>
</div>

<!-- ============ LOBBY ============ -->
<div class="screen" id="sLobby">
  <div class="top"><h1>Lobby</h1><div class="chip" id="lobChip">waiting</div></div>
  <div class="codebox">
    <div class="lbl">ROOM CODE</div>
    <div class="code" id="lobCode">----</div>
    <button class="gold" id="bShare" style="margin:6px 0 0">Share invite</button>
  </div>
  <div class="lbl" style="color:var(--dim);font-size:12.5px">PLAYERS</div>
  <div class="plist" id="lobPlayers"></div>
  <div id="hostBox">
    <div class="row">
      <div class="seg" role="group">
        <button id="mAuto" aria-pressed="true">Auto call</button>
        <button id="mHost" aria-pressed="false">I'll call</button>
      </div>
    </div>
    <button class="go" id="bStart">Start game</button>
  </div>
  <div class="wait" id="waitBox">Waiting for <b>the host</b> to start…</div>
  <button class="ghost" id="bLeave">Leave room</button>
</div>

<!-- ============ GAME ============ -->
<div class="screen" id="sGame">
  <div class="top">
    <h1>Housie Night</h1>
    <div class="chip" id="chip"><b>90</b> left</div>
  </div>
  <div class="stage">
    <div class="drum" id="drum"></div>
    <div class="ballwrap"><div class="halo" id="halo"></div><div class="ball empty" id="ball">?</div></div>
    <div class="callline" id="callline">Get ready…</div>
    <div class="trail" id="trail"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="seg" role="group" id="gseg">
      <button id="gAuto" aria-pressed="true">Auto call</button>
      <button id="gHost" aria-pressed="false">I'll call</button>
    </div>
    <button class="mini" id="snd" aria-label="Sound">🔊</button>
  </div>
  <select id="voice" aria-label="Caller voice"></select>
  <div class="controls"><button class="go" id="main">Start game</button></div>
  <div class="ticket"><table id="tk"><tbody></tbody></table></div>
  <div class="claims" id="claims"></div>
  <details>
    <summary>▸ Show the full board</summary>
    <div class="board" id="board"></div>
  </details>
  <button class="ghost" id="bQuit">Leave game</button>
</div>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<button id="dbgBtn" aria-label="Debug log">🐞</button>
<div id="dbg"></div>

<script type="module">

/* ==========================================================
   2. TICKETS

const COLORS=['#FFC531','#FF3D7F','#8CE84B','#3FC5FF','#C77DFF','#FF8A3D'];
const colRange=c=>c===0?[1,9]:c===8?[80,90]:[c*10,c*10+9];
const SUB={1:[[0],[1],[2]],2:[[0,1],[0,2],[1,2]],3:[[0,1,2]]};
function makeCounts(){const k=[1,1,1,1,1,1,1,1,1];
  for(let i=0;i<6;i++){const o=[];for(let c=0;c<9;c++)if(k[c]<3)o.push(c);
    k[o[Math.floor(Math.random()*o.length)]]++;}return k;}
function place(k){const rows=[5,5,5],g=Array.from({length:3},()=>Array(9).fill(false));
  (function s(c){if(c===9)return true;
    for(const set of SUB[k[c]].slice().sort(()=>Math.random()-.5)){
      if(set.some(r=>rows[r]===0))continue;
      set.forEach(r=>{rows[r]--;g[r][c]=true});
      if(s(c+1))return true;
      set.forEach(r=>{rows[r]++;g[r][c]=false});}
    return false;})(0);
  return rows.every(r=>r===0)?g:null;}
function newTicket(){let g=null;while(!g)g=place(makeCounts());
  const t=Array.from({length:3},()=>Array(9).fill(null));
  for(let c=0;c<9;c++){const[lo,hi]=colRange(c),p=[];for(let n=lo;n<=hi;n++)p.push(n);
    p.sort(()=>Math.random()-.5);
    const need=[0,1,2].filter(r=>g[r][c]);
    const pick=p.slice(0,need.length).sort((a,b)=>a-b);
    need.forEach((r,i)=>t[r][c]=pick[i]);}
  return t;}
const encT=t=>t.flat().map(n=>n||0).join(',');
const decT=s=>{const a=s.split(',').map(Number);
  return [0,1,2].map(r=>a.slice(r*9,r*9+9).map(n=>n||null));};

let AC=null,sound=true;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function blip(f,d,type,vol){if(!sound)return;
  try{const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.16,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(d||.14));
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.14));}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.28,'square',.13),i*95))}
function buzz(){blip(150,.22,'sawtooth',.14);setTimeout(()=>blip(110,.26,'sawtooth',.14),110)}

let voices=[],voice=null;
function rank(v){const l=(v.lang||'').toLowerCase();
  if(l.startsWith('hi'))return 0;
  if(l.startsWith('en-in'))return 1;
  if(/india|hindi|lekha|rishi|veena|kalpana|heera/i.test(v.name))return 1;
  if(l.startsWith('en'))return 2;return 3}
function loadVoices(){if(!window.speechSynthesis)return;
  voices=speechSynthesis.getVoices().slice().sort((a,b)=>rank(a)-rank(b));
  if(!voices.length)return;
  const s=$('voice');
  s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name.replace(/Microsoft |Google /,'')} · ${v.lang}</option>`).join('');
  if(!voice){voice=voices[0];s.value=0}
  s.style.display=voices.length>1?'block':'none'}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(n){if(!sound||!window.speechSynthesis)return;
  const nk=NICK[n],hi=voice&&(voice.lang||'').toLowerCase().startsWith('hi');
  let line;
  if(hi){const num=n<=20?HINDI_NUM[n]:String(n);line=nk?`${nk.h||nk.e}, ${num}`:`${num}`}
  else{const d=n<10?`Number ${n}`:`${String(n)[0]} ${String(n)[1]}, ${n}`;line=nk?`${nk.e}, ${n}`:d}
  const u=new SpeechSynthesisUtterance(line);
  if(voice){u.voice=voice;u.lang=voice.lang}
  u.rate=hi?.92:.95;u.pitch=1.05;
  speechSynthesis.cancel();speechSynthesis.speak(u)}

/* ---------- confetti ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let bits=[];
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}
sizeCv();addEventListener('resize',sizeCv);
function burst(n,power){for(let i=0;i<n;i++)bits.push({x:innerWidth/2,y:innerHeight*.42,
  vx:(Math.random()-.5)*(power||13),vy:(Math.random()-.9)*(power||13),
  r:Math.random()*6+3,c:COLORS[i%COLORS.length],a:1,sp:Math.random()*.3-.15,rot:Math.random()*6})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.a>0);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.32;b.vx*=.99;b.a-=.008;b.rot+=b.sp;
    cx.save();cx.globalAlpha=Math.max(b.a,0);cx.translate(b.x,b.y);cx.rotate(b.rot);
    cx.fillStyle=b.c;cx.fillRect(-b.r,-b.r/2,b.r*2,b.r);cx.restore()});
  requestAnimationFrame(loop)})();

/* ==========================================================
   4. STATE
   ========================================================== */
const PRIZES=[
 {id:'jaldi5',n:'Jaldi 5',h:'First five marks'},
 {id:'top',n:'Top line',h:'All of row 1'},
 {id:'mid',n:'Middle line',h:'All of row 2'},
 {id:'bot',n:'Bottom line',h:'All of row 3'},
 {id:'corner',n:'Four corners',h:'The four ends'},
 {id:'full',n:'Full housie',h:'Every number'}];

let me={id:'p'+Math.random().toString(36).slice(2,9),name:'Player'};
let room=null,isHost=false,solo=false,mode='auto',started=false;
let ticket=null,marked=new Set(),called=new Set(),claims={},players={};
let timer=null,rolling=false,unsub=[];

const rowNums=r=>ticket[r].filter(n=>n!==null);
function need(id){
  if(id==='top')return rowNums(0);
  if(id==='mid')return rowNums(1);
  if(id==='bot')return rowNums(2);
  if(id==='full')return[0,1,2].flatMap(rowNums);
  if(id==='corner'){const t=rowNums(0),b=rowNums(2);return[t[0],t[t.length-1],b[0],b[b.length-1]]}
  return[]}

function show(id){['sHome','sLobby','sGame'].forEach(s=>$(s).classList.toggle('on',s===id))}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}

/* ==========================================================
   5. ROOMS
   ========================================================== */
const R=p=>fx.ref(DB,p);
const code4=()=>{let s='';const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s};

async function hostGame(){
  me.name=($('nameIn').value||'Host').trim().slice(0,12);
  let code=code4(),tries=0;
  while(tries++<6){
    const snap=await fx.get(R('rooms/'+code));
    if(!snap.exists())break;
    code=code4();
  }
  ticket=newTicket();
  await fx.set(R('rooms/'+code),{
    host:me.id,status:'lobby',mode:'auto',created:Date.now(),
    players:{[me.id]:{name:me.name,ticket:encT(ticket),joined:Date.now()}}
  });
  room=code;isHost=true;solo=false;
  log('hosted room '+code);
  fx.onDisconnect(R(`rooms/${code}/players/${me.id}/gone`)).set(true);
  enterLobby();
}

async function joinGame(){
  const code=($('codeIn').value||'').toUpperCase().trim();
  if(code.length!==4){toast('Enter the 4-letter code',true);return}
  me.name=($('nameIn').value||'Player').trim().slice(0,12);
  const snap=await fx.get(R('rooms/'+code));
  if(!snap.exists()){toast('No room with that code',true);buzz();return}
  const r=snap.val();
  if(r.status==='playing'){toast('That game already started',true);return}
  ticket=newTicket();
  await fx.set(R(`rooms/${code}/players/${me.id}`),{name:me.name,ticket:encT(ticket),joined:Date.now()});
  room=code;isHost=false;solo=false;
  log('joined room '+code);
  fx.onDisconnect(R(`rooms/${code}/players/${me.id}/gone`)).set(true);
  enterLobby();
}

function enterLobby(){
  $('lobCode').textContent=room;
  $('hostBox').style.display=isHost?'block':'none';
  $('waitBox').style.display=isHost?'none':'block';
  show('sLobby');
  listen();
}

function listen(){
  clearListeners();
  unsub.push(fx.onValue(R(`rooms/${room}/players`),s=>{
    players=s.val()||{};
    const host=Object.keys(players)[0];
    $('lobPlayers').innerHTML=Object.entries(players)
      .filter(([id,p])=>!p.gone)
      .map(([id,p])=>`<span class="${id===me.id?'me ':''}${p.hostFlag||id===hostId?'host':''}">${esc(p.name)}</span>`).join('');
    $('lobChip').textContent=Object.keys(players).length+' in room';
  }));
  unsub.push(fx.onValue(R(`rooms/${room}/status`),s=>{
    const st=s.val();
    if(st==='playing'&&!started){started=true;beginGame()}
  }));
  unsub.push(fx.onValue(R(`rooms/${room}/mode`),s=>{
    mode=s.val()||'auto';syncModeUI();
  }));
  unsub.push(fx.onValue(R(`rooms/${room}/host`),s=>{hostId=s.val()}));
  unsub.push(fx.onChildAdded(R(`rooms/${room}/called`),s=>{
    const n=s.val();
    if(typeof n==='number'&&!called.has(n))showBall(n);
  }));
  unsub.push(fx.onValue(R(`rooms/${room}/claims`),s=>{
    const c=s.val()||{};
    Object.entries(c).forEach(([k,v])=>{
      if(!claims[k]){
        claims[k]=v;
        const p=PRIZES.find(x=>x.id===k);
        if(v.by===me.id){fanfare();burst(90,16);toast(`${p.n} — you got it! 🎉`)}
        else{toast(`${esc(v.name)} took ${p.n}`);blip(400,.15)}
        if(k==='full'){stopAuto();$('callline').textContent='HOUSIE! Game over';
          if(v.by===me.id){setTimeout(()=>burst(120,20),400);setTimeout(()=>burst(120,20),900)}}
      }
    });
    claims=c;drawClaims();
  }));
}
let hostId=null;
function clearListeners(){unsub.forEach(u=>{try{u()}catch(e){}});unsub=[]}
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function startGame(){
  await fx.update(R('rooms/'+room),{status:'playing',startedAt:Date.now()});
  log('game started');
}

function leave(){
  stopAuto();clearListeners();
  if(online&&room){try{fx.set(R(`rooms/${room}/players/${me.id}`),null)}catch(e){}}
  room=null;isHost=false;started=false;solo=false;
  called=new Set();marked=new Set();claims={};
  show('sHome');
}

/* ==========================================================
   6. GAME
   ========================================================== */
function beginGame(){
  show('sGame');
  drum();drawTicket();drawClaims();drawBoard();drawTrail();
  syncModeUI();
  $('callline').textContent=isHost||solo?'Tap start — good luck':'Waiting for the host…';
  log('entering game, host='+isHost);
}

function drum(){const d=$('drum');d.innerHTML='<div class="drum-lip"></div>';
  for(let i=0;i<7;i++){const b=document.createElement('i');
    b.style.setProperty('--c',COLORS[i%COLORS.length]);
    b.style.left=(i*19+6)+'px';b.style.top=(i%3*11+6)+'px';
    b.style.animationDelay=(i*.13)+'s';d.appendChild(b)}}

function drawTicket(){const tb=$('tk').querySelector('tbody');tb.innerHTML='';
  if(!ticket)return;
  ticket.forEach(row=>{const tr=document.createElement('tr');
    row.forEach(n=>{const td=document.createElement('td');
      if(n===null)td.className='blank';
      else{td.className='num';td.textContent=n;
        if(marked.has(n)){td.classList.add('dab');if(called.has(n))td.classList.add('good')}
        else if(called.has(n))td.classList.add('live');
        td.onclick=()=>{if(marked.has(n)){marked.delete(n);blip(300,.07)}
          else{marked.add(n);blip(called.has(n)?880:420,.1)}
          drawTicket();drawClaims()}}
      tr.appendChild(td)});
    tb.appendChild(tr)})}

function drawClaims(){const w=$('claims');w.innerHTML='';
  PRIZES.forEach(p=>{const b=document.createElement('button');
    let sub=p.h,cls='';
    const c=claims[p.id];
    if(c){sub=(c.by===me.id?'You won! 🏆':esc(c.name)+' 🏆');cls=c.by===me.id?'won':'gone'}
    else if(ticket){
      if(p.id==='jaldi5'){const g=[...marked].filter(n=>called.has(n)).length;
        if(g>=5){sub='Claim it now!';cls='ready'}else sub=`${g} of 5 marked`}
      else{const req=need(p.id),left=req.filter(n=>!called.has(n)).length,
        unm=req.filter(n=>called.has(n)&&!marked.has(n)).length;
        if(left===0&&unm===0){sub='Claim it now!';cls='ready'}
        else if(left===0){sub=`${unm} left to mark`;cls='close'}
        else if(left<=2){sub=`${left} to go!`;cls='close'}
        else sub=`${left} still in the bag`}}
    b.innerHTML=`${p.n}<span>${sub}</span>`;
    if(cls)b.classList.add(cls);
    if(c)b.disabled=true;
    b.onclick=()=>claim(p);
    w.appendChild(b)})}

function drawBoard(){const b=$('board');b.innerHTML='';
  for(let n=1;n<=90;n++){const d=document.createElement('div');d.textContent=n;
    if(called.has(n))d.className='hit';b.appendChild(d)}}

function drawTrail(){const last=[...called].slice(-5,-1).reverse();
  $('trail').innerHTML=last.map(n=>`<b style="--c:${COLORS[n%COLORS.length]}">${n}</b>`).join('');
  $('chip').innerHTML=`<b>${90-called.size}</b> left`}

/* --- pushing a number (host / solo only) --- */
function pickNumber(){
  if(rolling)return;
  const left=[];for(let n=1;n<=90;n++)if(!called.has(n))left.push(n);
  if(!left.length){stopAuto();toast('Bag is empty!');return}
  const n=left[Math.floor(Math.random()*left.length)];
  if(solo)showBall(n);
  else fx.push(R(`rooms/${room}/called`),n).catch(e=>log('push fail '+e.message,true));
}

/* --- animating a number (everyone) --- */
function showBall(n){
  if(called.has(n))return;
  called.add(n);
  rolling=true;
  const ball=$('ball'),dr=$('drum');
  dr.classList.add('spin');
  ball.classList.remove('empty','drop');ball.classList.add('rolling');
  $('callline').textContent='...';
  let t=0;
  const spin=setInterval(()=>{
    const f=1+Math.floor(Math.random()*90);
    ball.textContent=f;ball.style.setProperty('--bc',COLORS[f%COLORS.length]);
    blip(500+t*40,.04,'square',.06);t++},70);
  setTimeout(()=>{
    clearInterval(spin);dr.classList.remove('spin');
    ball.classList.remove('rolling');
    ball.textContent=n;ball.style.setProperty('--bc',COLORS[n%COLORS.length]);
    void ball.offsetWidth;ball.classList.add('drop');
    const h=$('halo');h.classList.remove('go2');void h.offsetWidth;h.classList.add('go2');
    blip(660,.18,'triangle',.18);setTimeout(()=>blip(990,.2,'triangle',.14),90);
    const cl=$('callline');cl.textContent=NICK[n]?NICK[n].e:`Number ${n}`;
    cl.classList.remove('in');void cl.offsetWidth;cl.classList.add('in');
    speak(n);
    if(ticket&&ticket.flat().includes(n))burst(14,7);
    drawTrail();drawBoard();drawTicket();drawClaims();
    rolling=false},900);
}

function startAuto(){stopAuto();timer=setInterval(pickNumber,6500)}
function stopAuto(){clearInterval(timer);timer=null}

function syncModeUI(){
  const canCall=isHost||solo;
  $('gseg').style.display=canCall?'flex':'none';
  $('main').style.display=canCall?'block':'none';
  $('gAuto').setAttribute('aria-pressed',mode==='auto');
  $('gHost').setAttribute('aria-pressed',mode!=='auto');
  $('mAuto').setAttribute('aria-pressed',mode==='auto');
  $('mHost').setAttribute('aria-pressed',mode!=='auto');
}

/* --- claims --- */
async function claim(p){
  if(!ticket)return;
  if(!called.size){toast('Nothing called yet',true);buzz();return}
  if(claims[p.id]){toast('Already taken',true);return}
  if(p.id==='jaldi5'){
    const good=[...marked].filter(n=>called.has(n)).length;
    if(good<5){toast(`Only ${good} correct marks — bogey!`,true);bogey();return}
  }else{
    const req=need(p.id),miss=req.filter(n=>!called.has(n));
    if(miss.length){toast(`Bogey! ${miss.length} still in the bag`,true);bogey();return}
    const un=req.filter(n=>!marked.has(n));
    if(un.length){toast('Mark them on your ticket first',true);buzz();return}
  }
  if(solo){
    claims[p.id]={by:me.id,name:me.name};
    fanfare();burst(90,16);toast(`${p.n} — verified! 🎉`);
    if(p.id==='full'){stopAuto();$('callline').textContent='HOUSIE! Game over';
      setTimeout(()=>burst(120,20),400)}
    drawClaims();return;
  }
  /* first write wins */
  const res=await fx.runTransaction(R(`rooms/${room}/claims/${p.id}`),cur=>
    cur===null?{by:me.id,name:me.name,at:Date.now()}:undefined);
  if(!res.committed){toast('Someone beat you to it!',true);buzz()}
  else log('claimed '+p.id);
}
function bogey(){buzz();document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),500)}

/* ==========================================================
   7. WIRING
   ========================================================== */
$('bHost').onclick=()=>{ac();hostGame().catch(e=>{log('host fail '+e.message,true);toast('Could not create room',true)})};
$('bJoin').onclick=()=>{ac();joinGame().catch(e=>{log('join fail '+e.message,true);toast('Could not join',true)})};
$('bSolo').onclick=()=>{ac();solo=true;isHost=true;started=true;me.name='You';
  ticket=newTicket();called=new Set();marked=new Set();claims={};beginGame()};
$('bStart').onclick=()=>startGame().catch(e=>log('start fail '+e.message,true));
$('bLeave').onclick=leave;
$('bQuit').onclick=leave;

$('bShare').onclick=async()=>{
  const url=location.origin+location.pathname+'?room='+room;
  const text=`Housie khelein! Room code: ${room}\n${url}`;
  if(navigator.share){try{await navigator.share({title:'Housie Night',text})}catch(e){}}
  else{try{await navigator.clipboard.writeText(text);toast('Invite copied!')}catch(e){toast(room)}}
};

function setMode(m){
  mode=m;syncModeUI();
  if(!solo&&isHost)fx.set(R(`rooms/${room}/mode`),m);
  stopAuto();
  if(started&&m==='auto'&&$('main').textContent!=='Start game')startAuto();
  $('main').textContent=m==='auto'?($('main').textContent==='Start game'?'Start game':'Pause'):'Call next number';
}
$('mAuto').onclick=()=>setMode('auto');
$('mHost').onclick=()=>setMode('host');
$('gAuto').onclick=()=>setMode('auto');
$('gHost').onclick=()=>setMode('host');

let running=false;
$('main').onclick=()=>{
  ac();
  if(mode==='host'){pickNumber();$('main').textContent='Call next number';return}
  if(!running){running=true;$('main').textContent='Pause';pickNumber();startAuto()}
  else{running=false;stopAuto();$('main').textContent='Resume'}
};

$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';
  if(!sound&&window.speechSynthesis)speechSynthesis.cancel()};
$('voice').onchange=e=>{voice=voices[e.target.value];const s=sound;sound=true;speak(88);sound=s};

$('codeIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};

/* prefill room code from a shared link */
const qs=new URLSearchParams(location.search).get('room');
if(qs){$('codeIn').value=qs.toUpperCase().slice(0,4);log('code from link: '+qs)}

drum();
log('ready');
</script>
