<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Housie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --baize:#16624A;        /* the table */
  --baize-dk:#0E4B39;
  --baize-lt:#1E7A5C;
  --paper:#FBEFD6;        /* ticket stock */
  --paper-dk:#EBD9B8;
  --ink:#C1272D;          /* printed red ink */
  --ink-dk:#8E1519;
  --marigold:#F5A623;
  --marigold-dk:#B87407;
  --wood:#7A4A21;
  --wood-dk:#553113;
  --charcoal:#2B2118;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:
    radial-gradient(ellipse 90% 55% at 50% 0%, var(--baize-lt) 0%, transparent 70%),
    var(--baize);
  background-attachment:fixed;
  color:var(--paper);
  font-family:Archivo,system-ui,sans-serif;font-weight:600;
  padding:12px 14px 40px;max-width:520px;margin:0 auto;min-height:100vh;
}
/* felt texture */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(rgba(0,0,0,.16) .5px, transparent .5px),
    radial-gradient(rgba(255,255,255,.05) .5px, transparent .5px);
  background-size:4px 4px, 7px 7px;
  background-position:0 0, 2px 3px;
}
body>*{position:relative;z-index:1}
body.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}
30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.screen{display:none}.screen.on{display:block}

h1{
  font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:25px;margin:0;flex:1;
  color:var(--paper);letter-spacing:.3px;
  text-shadow:2px 2px 0 var(--ink-dk);
}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chip{
  background:var(--baize-dk);border:1.5px solid rgba(251,239,214,.2);
  border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;color:var(--paper-dk);
}
.chip b{color:var(--marigold)}

/* ============ buttons: pressed wooden counters ============ */
button{
  font-family:Archivo,sans-serif;font-weight:800;font-size:15.5px;letter-spacing:.2px;
  border:none;border-radius:11px;padding:15px 12px;cursor:pointer;width:100%;
  background:#F3E4C4;color:var(--charcoal);
  box-shadow:0 4px 0 #BFA97F, 0 6px 12px rgba(0,0,0,.28);
  transition:transform .07s,box-shadow .07s;margin-bottom:10px;
}
button:active{transform:translateY(4px);box-shadow:0 0 0 #BFA97F,0 2px 5px rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.go{background:linear-gradient(180deg,#D93B41,var(--ink));color:#FFF3E0;
  box-shadow:0 4px 0 var(--ink-dk),0 6px 14px rgba(0,0,0,.3)}
.go:active{box-shadow:0 0 0 var(--ink-dk),0 2px 5px rgba(0,0,0,.3)}
.gold{background:linear-gradient(180deg,#FFC048,var(--marigold));color:#3A2400;
  box-shadow:0 4px 0 var(--marigold-dk),0 6px 14px rgba(0,0,0,.3)}
.gold:active{box-shadow:0 0 0 var(--marigold-dk),0 2px 5px rgba(0,0,0,.3)}
button:disabled{opacity:.42;box-shadow:0 4px 0 #BFA97F}
.ghost{background:transparent;box-shadow:none;color:rgba(251,239,214,.6);
  font-size:13.5px;font-weight:700;padding:11px;text-decoration:underline;text-underline-offset:3px}
.ghost:active{transform:none;box-shadow:none}
.rowb{display:flex;gap:10px}

input{
  width:100%;background:var(--paper);border:none;border-bottom:3px solid var(--paper-dk);
  border-radius:10px 10px 4px 4px;padding:15px 14px;color:var(--charcoal);
  font-family:Archivo;font-weight:800;font-size:16px;margin-bottom:11px;
}
input::placeholder{color:#B0A084;font-weight:600}
input:focus{outline:none;border-bottom-color:var(--ink)}
#codeIn{text-align:center;font-family:'Alfa Slab One',serif;font-weight:400;
  font-size:30px;letter-spacing:9px;text-indent:9px;color:var(--ink)}
.hint{color:rgba(251,239,214,.55);font-size:12.5px;text-align:center;margin:2px 0 14px;font-weight:600}

/* ============ home ============ */
.hero{text-align:center;padding:14px 0 20px;position:relative}
.hero .big{
  font-family:'Alfa Slab One',serif;font-weight:400;font-size:52px;line-height:.92;
  color:var(--paper);
  text-shadow:
    3px 3px 0 var(--ink), 6px 6px 0 var(--ink-dk), 0 12px 24px rgba(0,0,0,.35);
}
.hero p{color:var(--marigold);font-size:14px;margin:14px 0 0;font-weight:700}
.garland{display:flex;justify-content:center;gap:7px;margin-bottom:16px}
.garland i{
  width:26px;height:26px;border-radius:50%;font-style:normal;
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--charcoal);
  background:radial-gradient(circle at 36% 30%,#fff,var(--tk,#F3E4C4) 62%,#C4AE85);
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.garland i:nth-child(odd){transform:translateY(-5px)}

/* ============ the caller's tray ============ */
.stage{
  position:relative;border-radius:20px;padding:12px 12px 16px;overflow:hidden;
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), transparent 40%),
    linear-gradient(175deg, var(--wood), var(--wood-dk));
  border:2px solid rgba(0,0,0,.25);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.35);
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(94deg,transparent 0 6px,rgba(0,0,0,.35) 6px 7px);
}
.drum{height:46px;position:relative;margin:0 auto;width:150px}
.drum i{position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff,var(--c) 70%);
  box-shadow:0 1px 2px rgba(0,0,0,.4);
  animation:tumble 1.5s infinite ease-in-out}
@keyframes tumble{0%,100%{transform:translate(0,0)}25%{transform:translate(9px,-11px)}
50%{transform:translate(-6px,7px)}75%{transform:translate(11px,5px)}}
.drum.spin i{animation-duration:.26s}
.drum-lip{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
  width:132px;height:12px;border-radius:0 0 60px 60px;
  background:linear-gradient(180deg,rgba(0,0,0,.4),transparent)}

.ballwrap{height:148px;display:flex;align-items:center;justify-content:center;position:relative}
.ball{
  width:124px;height:124px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Alfa Slab One',serif;font-weight:400;font-size:54px;
  color:var(--ink);
  background:radial-gradient(circle at 36% 28%,#FFFDF7 0%,var(--bc,#F3E4C4) 55%,#BFA97F 100%);
  box-shadow:0 9px 0 rgba(0,0,0,.32), inset 0 -7px 12px rgba(0,0,0,.16),
             inset 0 5px 10px rgba(255,255,255,.7);
  position:relative;
}
.ball::before{
  content:"";position:absolute;inset:11px;border-radius:50%;
  border:2.5px solid rgba(193,39,45,.28);
}
.ball.empty{background:rgba(0,0,0,.22);border:3px dashed rgba(251,239,214,.22);
  box-shadow:inset 0 4px 10px rgba(0,0,0,.4);color:rgba(251,239,214,.25);font-size:34px}
.ball.empty::before{display:none}
.ball.drop{animation:drop .75s cubic-bezier(.34,1.5,.64,1)}
@keyframes drop{0%{transform:translateY(-190px) scale(.35) rotate(-200deg);opacity:0}
55%{transform:translateY(12px) scale(1.12) rotate(6deg);opacity:1}
72%{transform:translateY(-14px) scale(.97) rotate(-3deg)}100%{transform:translateY(0) scale(1)}}
.ball.rolling{animation:rollpick .08s infinite linear}
@keyframes rollpick{0%{transform:scale(.93) rotate(-5deg)}50%{transform:scale(1.02) rotate(5deg)}100%{transform:scale(.93) rotate(-5deg)}}
.halo{position:absolute;width:124px;height:124px;border-radius:50%;
  border:3px solid var(--marigold);opacity:0}
.halo.go2{animation:halo .85s ease-out}
@keyframes halo{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}

.callline{
  text-align:center;font-family:'Alfa Slab One',serif;font-weight:400;font-size:16px;
  color:#FFE9BC;min-height:22px;text-shadow:1px 1px 0 rgba(0,0,0,.4);
}
.callline.in{animation:slidein .45s ease-out}
@keyframes slidein{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}
.trail{display:flex;gap:6px;justify-content:center;margin-top:11px;min-height:29px}
.trail b{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:var(--charcoal);
  background:radial-gradient(circle at 34% 28%,#fff,var(--c) 72%);
  box-shadow:0 2px 3px rgba(0,0,0,.35);animation:slidein .4s ease-out}

.wonstrip{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;justify-content:center}
.wonstrip b{background:rgba(0,0,0,.28);border-radius:999px;padding:5px 11px;
  font-size:11.5px;color:#FFE9BC;font-weight:800;animation:pop .35s}
.wonstrip b.mine{background:var(--marigold);color:#3A2400}
.wonstrip b i{opacity:.62;font-style:normal;font-weight:600}

/* ============ controls ============ */
.controls{display:flex;gap:9px;margin:13px 0 2px}
.row{display:flex;gap:9px;align-items:stretch;margin-bottom:9px}
.seg{display:flex;background:var(--baize-dk);border-radius:12px;padding:4px;gap:4px;flex:1;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.seg button{background:transparent;color:rgba(251,239,214,.6);padding:10px 4px;
  font-size:13.5px;box-shadow:none;margin:0;border-radius:9px}
.seg button:active{transform:none;box-shadow:none}
.seg button[aria-pressed="true"]{background:var(--marigold);color:#3A2400;box-shadow:0 2px 0 var(--marigold-dk)}
.mini{flex:0 0 52px;width:52px;padding:12px 0;font-size:18px;margin:0}
#voice{width:100%;margin-bottom:9px;display:none;background:var(--baize-dk);
  color:var(--paper-dk);border:1.5px solid rgba(251,239,214,.18);border-radius:11px;
  padding:12px;font-family:Archivo;font-weight:700;font-size:13.5px}

/* ============ THE TICKET — the hero ============ */
.ticket{
  background:var(--paper);border-radius:6px;padding:0 0 10px;margin-top:18px;
  box-shadow:0 10px 0 rgba(0,0,0,.22), 0 14px 30px rgba(0,0,0,.32);
  position:relative;
}
/* torn perforation down both sides */
.ticket::before,.ticket::after{
  content:"";position:absolute;top:0;bottom:0;width:7px;
  background:radial-gradient(circle at 50% 0, transparent 0 3.5px, var(--paper) 3.5px);
  background-size:7px 9px;
}
.ticket::before{left:-3px}.ticket::after{right:-3px}
.tkhead{
  display:flex;align-items:baseline;gap:8px;
  padding:9px 13px 8px;border-bottom:2.5px solid var(--ink);
  color:var(--ink);
}
.tkhead .tn{font-family:'Alfa Slab One',serif;font-weight:400;font-size:15px;flex:1;letter-spacing:.4px}
.tkhead .ts{font-size:11px;font-weight:800;opacity:.65;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0}
td{
  height:47px;text-align:center;font-family:Archivo;font-weight:800;font-size:19px;
  color:var(--charcoal);border:1.5px solid rgba(193,39,45,.35);position:relative;
}
td:first-child{border-left:none}td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
td.blank{background:
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(193,39,45,.09) 5px 6px)}
td.num{cursor:pointer;user-select:none}
td.num:active{background:rgba(193,39,45,.1)}
/* the dauber blot */
td.dab{color:transparent}
td.dab::after{
  content:attr(data-n);position:absolute;inset:4px;border-radius:50%;
  display:grid;place-items:center;color:#FFF0F0;font-size:17px;
  background:radial-gradient(circle at 38% 32%,#E14A4F,var(--ink) 70%);
  box-shadow:0 2px 4px rgba(142,21,25,.5);
  animation:dab .3s cubic-bezier(.34,1.5,.64,1);
}
td.dab.good::after{background:radial-gradient(circle at 38% 32%,#3FA86F,#1B7A49 70%);
  box-shadow:0 2px 4px rgba(15,80,45,.5)}
@keyframes dab{0%{transform:scale(.25) rotate(-25deg)}62%{transform:scale(1.18)}100%{transform:scale(1)}}
td.live{background:var(--marigold);animation:live 1.1s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,.9)}
50%{box-shadow:inset 0 0 0 4px rgba(255,255,255,.75)}}

/* ============ claims ============ */
.claims{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.claims button{text-align:left;padding:13px 11px;font-size:14.5px;margin:0;
  background:#F3E4C4;color:var(--charcoal)}
.claims button span{display:block;font-size:11.5px;font-weight:700;color:#7C6A4C;margin-top:3px}
.claims button.close{background:linear-gradient(180deg,#FFD98A,#F7C25C);
  box-shadow:0 4px 0 var(--marigold-dk),0 6px 12px rgba(0,0,0,.28)}
.claims button.close span{color:#7A4B00}
.claims button.ready{background:linear-gradient(180deg,#4FD08A,#1E9B5C);color:#04301C;
  box-shadow:0 4px 0 #0C5F36,0 6px 14px rgba(0,0,0,.3);animation:beg .85s infinite}
.claims button.ready span{color:#04452A}
@keyframes beg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.claims button.won{background:linear-gradient(180deg,#FFC048,var(--marigold));color:#3A2400;
  box-shadow:0 4px 0 var(--marigold-dk);animation:none}
.claims button.won span{color:#7A4B00}
.claims button.gone{opacity:.4;animation:none}

/* ============ lobby ============ */
.codebox{
  background:var(--paper);color:var(--charcoal);border-radius:6px;
  padding:16px 14px 14px;text-align:center;margin-bottom:16px;
  box-shadow:0 8px 0 rgba(0,0,0,.2),0 12px 26px rgba(0,0,0,.3);
  border-top:5px solid var(--ink);
}
.codebox .lbl{color:#8A7758;font-size:12px;font-weight:700}
.codebox .code{font-family:'Alfa Slab One',serif;font-weight:400;font-size:48px;
  color:var(--ink);letter-spacing:7px;text-indent:7px;margin:2px 0 10px;line-height:1.05}
.plist{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}
.prow{display:flex;align-items:center;gap:9px;background:var(--baize-dk);
  border-radius:11px;padding:12px 13px;font-size:14.5px;animation:pop .3s;
  border-left:4px solid rgba(251,239,214,.25)}
.prow.me{background:var(--paper);color:var(--charcoal);border-left-color:var(--ink)}
.prow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.prow .tag{font-size:11px;opacity:.6;font-weight:800}
.prow .kick{flex:0 0 30px;width:30px;height:30px;padding:0;margin:0;border-radius:50%;
  background:rgba(193,39,45,.85);color:#fff;font-size:14px;box-shadow:0 2px 0 var(--ink-dk)}
.prow.off{opacity:.45}
.prow .near{background:var(--ink);color:#FFF0DE;border-radius:999px;padding:4px 9px;
  font-size:10.5px;font-weight:800;animation:beg 1s infinite}
.lockbtn{flex:0 0 auto;width:auto;padding:8px 13px;font-size:12.5px;margin:0}
.lockbtn.shut{background:linear-gradient(180deg,#D93B41,var(--ink));color:#FFF3E0;
  box-shadow:0 3px 0 var(--ink-dk)}
@keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
.wait{text-align:center;color:rgba(251,239,214,.7);font-size:14px;padding:16px 0;font-weight:600}
.wait b{color:var(--marigold)}

/* ============ speed slider ============ */
.speed{background:var(--baize-dk);border-radius:12px;padding:11px 14px 6px;margin-bottom:10px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.slab{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.slab span{flex:1;font-size:13px;color:rgba(251,239,214,.7);font-weight:700}
.slab b{font-family:'Alfa Slab One',serif;font-weight:400;font-size:18px;color:var(--marigold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;
  margin:0;padding:8px 0;border:none;border-radius:0}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible{outline:3px solid var(--marigold);outline-offset:4px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--ink),var(--marigold));box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--ink),var(--marigold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;margin-top:-9px;border:none;
  background:radial-gradient(circle at 36% 30%,#FFFDF7,#F3E4C4 60%,#BFA97F);
  box-shadow:0 3px 5px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;border:none;
  background:radial-gradient(circle at 36% 30%,#FFFDF7,#F3E4C4 60%,#BFA97F);
  box-shadow:0 3px 5px rgba(0,0,0,.45)}

/* ============ banner + toast ============ */
.banner{
  position:fixed;left:0;right:0;top:0;z-index:65;padding:22px 16px 24px;text-align:center;
  background:linear-gradient(180deg,#FFC048,var(--marigold));color:#3A2400;
  transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.35);
  box-shadow:0 10px 34px rgba(0,0,0,.55);
  border-bottom:5px solid var(--ink);
}
.banner.show{transform:translateY(0)}
.banner .bl{font-family:Archivo;font-weight:800;font-size:13px;letter-spacing:2.5px;opacity:.72}
.banner .bn{font-family:'Alfa Slab One',serif;font-weight:400;font-size:32px;line-height:1.08;margin-top:3px}
.banner.mine{background:linear-gradient(180deg,#4FD08A,#1E9B5C);color:#03301B;border-bottom-color:#0C5F36}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);
  background:var(--paper);color:var(--charcoal);font-weight:800;font-size:14.5px;
  padding:13px 22px;border-radius:999px;z-index:60;max-width:88vw;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.35);
}
.toast.show{transform:translate(-50%,0);transition:transform .3s cubic-bezier(.2,.9,.3,1.4)}
.toast.bad{background:var(--ink);color:#FFF0DE;box-shadow:0 6px 0 var(--ink-dk)}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
details{margin-top:18px}
summary{cursor:pointer;color:rgba(251,239,214,.65);font-size:13.5px;list-style:none;
  padding:8px 0;font-weight:700}
summary::-webkit-details-marker{display:none}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.board div{font-size:11px;text-align:center;padding:6px 0;border-radius:5px;font-weight:800;
  background:rgba(0,0,0,.24);color:rgba(251,239,214,.4)}
.board div.hit{background:var(--paper);color:var(--ink);animation:dab .3s}

#dbg{position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:#000D;
  color:#7FE3A8;font-family:ui-monospace,monospace;font-size:11px;font-weight:400;
  padding:8px 10px 30px;z-index:70;display:none;white-space:pre-wrap;line-height:1.4}
#dbg .err{color:#FF8A8A}
#dbgBtn{position:fixed;right:9px;bottom:9px;width:38px;height:38px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.45);color:#7FE3A8;font-size:15px;z-index:71;box-shadow:none;margin:0;opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen on" id="sHome">
  <div class="hero">
    <div class="garland">
      <i style="--tk:#F3E4C4">7</i><i style="--tk:#FFD98A">22</i><i style="--tk:#F3E4C4">45</i>
      <i style="--tk:#FFD98A">66</i><i style="--tk:#F3E4C4">88</i><i style="--tk:#FFD98A">90</i>
    </div>
    <div class="big">HOUSIE</div>
    <p>Ek phone, poora khandaan</p>
  </div>
  <input id="nameIn" placeholder="Your name" maxlength="12" autocomplete="off">
  <button class="go" id="bHost">Host a game</button>
  <div class="rowb">
    <input id="codeIn" placeholder="CODE" maxlength="4" autocapitalize="characters" autocomplete="off" style="margin-bottom:9px">
  </div>

const SUB={1:[[0],[1],[2]],2:[[0,1],[0,2],[1,2]],3:[[0,1,2]]};
function makeCounts(){const k=[1,1,1,1,1,1,1,1,1];
  for(let i=0;i<6;i++){const o=[];for(let c=0;c<9;c++)if(k[c]<3)o.push(c);
    k[o[Math.floor(Math.random()*o.length)]]++;}return k;}
function place(k){const rows=[5,5,5],g=Array.from({length:3},()=>Array(9).fill(false));
  (function s(c){if(c===9)return true;
    for(const set of SUB[k[c]].slice().sort(()=>Math.random()-.5)){
      if(set.some(r=>rows[r]===0))continue;
      set.forEach(r=>{rows[r]--;g[r][c]=true});
      if(s(c+1))return true;
      set.forEach(r=>{rows[r]++;g[r][c]=false});}
    return false;})(0);
  return rows.every(r=>r===0)?g:null;}
function newTicket(){let g=null;while(!g)g=place(makeCounts());

  for(let c=0;c<9;c++){const[lo,hi]=colRange(c),p=[];for(let n=lo;n<=hi;n++)p.push(n);
    p.sort(()=>Math.random()-.5);
    const need=[0,1,2].filter(r=>g[r][c]);
    const pick=p.slice(0,need.length).sort((a,b)=>a-b);
    need.forEach((r,i)=>t[r][c]=pick[i]);}

/* ---------- how close am I? tell the room ---------- */
let announced={};
function myClosest(){
  if(!ticket)return null;
  let best=null;
  PRIZES.forEach(p=>{
    if(claims[p.id])return;
    let left;
    if(p.id==='jaldi5')left=Math.max(0,5-[...marked].filter(n=>called.has(n)).length);
    else left=need(p.id).filter(n=>!called.has(n)).length;
    if(best===null||left<best.left)best={left,name:p.n};
  });
  return best;
}
function broadcastProgress(){
  if(solo||!room||!started)return;
  const b=myClosest();
  if(!b)return;
  const val=b.left<=2?{left:b.left,prize:b.name}:null;
  fx.set(R(`rooms/${room}/players/${me.id}/near`),val).catch(()=>{});
}
function checkNearMisses(){
  Object.entries(players).forEach(([id,p])=>{
    if(id===me.id||!p.near||p.near.left>1)return;
    const key=id+p.near.prize;
    if(announced[key])return;
    announced[key]=true;
    toast(`${esc(p.name)} needs 1 for ${p.near.prize}!`);
    blip(880,.1,'square',.1);
  });
}

function renderPlayers(){
  const ids=Object.keys(players);
  $('pCount').textContent=`(${ids.length})`;
  $('lobChip').textContent=ids.length===1?'1 player':ids.length+' players';
  $('lobPlayers').innerHTML='';
  ids.sort((a,b)=>(players[a].joined||0)-(players[b].joined||0)).forEach(id=>{
    const p=players[id];
    const row=document.createElement('div');
    row.className='prow'+(id===me.id?' me':'')+(p.gone?' off':'');
    let tag='';
    if(id===hostId)tag='HOST 👑';
    else if(p.gone)tag='offline';
    row.innerHTML=`<div class="nm">${esc(p.name)}${id===me.id?' (you)':''}</div>
      <div class="tag">${tag}</div>`;
    if(isHost&&id!==me.id){
      const k=document.createElement('button');
      k.className='kick';k.textContent='✕';k.setAttribute('aria-label','Remove '+p.name);
      k.onclick=()=>kick(id,p.name);
      row.appendChild(k);
    }
    $('lobPlayers').appendChild(row);
  });
  $('bLock').style.display=isHost?'block':'none';
  $('bStart').textContent=ids.length<2?'Start anyway (solo)':`Start game · ${ids.length} players`;
}

async function kick(id,name){
  if(!confirm(`Remove ${name} from the room?`))return;
  await fx.set(R(`rooms/${room}/players/${id}`),null);
  toast(`${name} removed`);log('kicked '+name);
}

async function toggleLock(){
  const s=await fx.get(R(`rooms/${room}/locked`));
  const next=!s.val();
  await fx.set(R(`rooms/${room}/locked`),next);
  toast(next?'Room locked — no new players':'Room open again');
}

function renderScoreboard(){
  const el=$('scores');if(!el)return;
  const wins={};
  Object.entries(claims).forEach(([k,v])=>{wins[v.by]=(wins[v.by]||0)+1});
  el.innerHTML=Object.keys(players)
    .sort((a,b)=>(wins[b]||0)-(wins[a]||0))
    .map(id=>{
      const p=players[id];
      const near=p.near&&p.near.left<=2
        ? `<div class="near">${p.near.left} to go · ${esc(p.near.prize)}</div>`:'';
      return `<div class="prow${id===me.id?' me':''}${p.gone?' off':''}">
        <div class="nm">${esc(p.name)}${id===me.id?' (you)':''}</div>
        ${near}<div class="tag">${'🏆'.repeat(wins[id]||0)||'—'}</div></div>`;
    }).join('');
}
function clearListeners(){unsub.forEach(u=>{try{u()}catch(e){}});unsub=[]}
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function startGame(){
  const n=Object.keys(players).length;
  if(n<2&&!confirm('Only you are in the room. Start anyway?'))return;
  await fx.update(R('rooms/'+room),{status:'playing',locked:true,startedAt:Date.now()});
  log('game started with '+n+' players');
}

function leave(){
  stopAuto();clearListeners();
  if(online&&room){try{fx.set(R(`rooms/${room}/players/${me.id}`),null)}catch(e){}}
  room=null;isHost=false;started=false;solo=false;
  called=new Set();marked=new Set();claims={};
  show('sHome');
}

/* ==========================================================
   6. GAME
   ========================================================== */
function beginGame(){
  show('sGame');
  drum();drawTicket();drawClaims();drawBoard();drawTrail();renderScoreboard();
  syncModeUI();updateMainBtn();
  $('callline').textContent=isHost||solo?'Tap start — good luck':'Waiting for the host…';
  log('entering game, host='+isHost);
}

function drum(){const d=$('drum');d.innerHTML='<div class="drum-lip"></div>';
  for(let i=0;i<7;i++){const b=document.createElement('i');
    b.style.setProperty('--c',COLORS[i%COLORS.length]);
    b.style.left=(i*19+6)+'px';b.style.top=(i%3*11+6)+'px';
    b.style.animationDelay=(i*.13)+'s';d.appendChild(b)}}

function drawTicket(){const tb=$('tk').querySelector('tbody');tb.innerHTML='';
  if(!ticket)return;
  const ser=$('tkSerial');
  if(ser)ser.textContent='No. '+String(ticket.flat().filter(Boolean).reduce((a,b)=>a+b,0)*7%9000+1000);
  ticket.forEach(row=>{const tr=document.createElement('tr');
    row.forEach(n=>{const td=document.createElement('td');
      if(n===null)td.className='blank';
      else{td.className='num';td.textContent=n;td.dataset.n=n;
        if(marked.has(n)){td.classList.add('dab');if(called.has(n))td.classList.add('good')}
        else if(called.has(n))td.classList.add('live');
        td.onclick=()=>{if(marked.has(n)){marked.delete(n);blip(300,.07)}
          else{marked.add(n);blip(called.has(n)?880:420,.1)}
          drawTicket();drawClaims();broadcastProgress()}}
      tr.appendChild(td)});
    tb.appendChild(tr)})}

function drawClaims(){const w=$('claims');w.innerHTML='';
  PRIZES.forEach(p=>{const b=document.createElement('button');
    let sub=p.h,cls='';
    const c=claims[p.id];
    if(c){sub=(c.by===me.id?'You won! 🏆':esc(c.name)+' 🏆');cls=c.by===me.id?'won':'gone'}
    else if(ticket){
      if(p.id==='jaldi5'){const g=[...marked].filter(n=>called.has(n)).length;
        if(g>=5){sub='Claim it now!';cls='ready'}else sub=`${g} of 5 marked`}
      else{const req=need(p.id),left=req.filter(n=>!called.has(n)).length,
        unm=req.filter(n=>called.has(n)&&!marked.has(n)).length;
        if(left===0&&unm===0){sub='Claim it now!';cls='ready'}
        else if(left===0){sub=`${unm} left to mark`;cls='close'}
        else if(left<=2){sub=`${left} to go!`;cls='close'}
        else sub=`${left} still in the bag`}}
    b.innerHTML=`${p.n}<span>${sub}</span>`;
    if(cls)b.classList.add(cls);
    if(c)b.disabled=true;
    b.onclick=()=>claim(p);
    w.appendChild(b)})}

function drawBoard(){const b=$('board');b.innerHTML='';
  for(let n=1;n<=90;n++){const d=document.createElement('div');d.textContent=n;
    if(called.has(n))d.className='hit';b.appendChild(d)}}

function drawTrail(){const last=[...called].slice(-5,-1).reverse();
  $('trail').innerHTML=last.map(n=>`<b style="--c:${COLORS[n%COLORS.length]}">${n}</b>`).join('');
  $('chip').innerHTML=`<b>${90-called.size}</b> left`}

/* --- pushing a number (host / solo only) --- */
function pickNumber(){
  if(rolling)return;
  const left=[];for(let n=1;n<=90;n++)if(!called.has(n))left.push(n);
  if(!left.length){stopAuto();toast('Bag is empty!');return}
  const n=left[Math.floor(Math.random()*left.length)];
  if(solo)showBall(n);
  else fx.push(R(`rooms/${room}/called`),n).catch(e=>log('push fail '+e.message,true));
}

/* --- animating a number (everyone) --- */
function showBall(n){
  if(called.has(n))return;
  called.add(n);
  rolling=true;
  const ball=$('ball'),dr=$('drum');
  dr.classList.add('spin');
  ball.classList.remove('empty','drop');ball.classList.add('rolling');
  $('callline').textContent='...';
  let t=0;
  const spin=setInterval(()=>{
    const f=1+Math.floor(Math.random()*90);
    ball.textContent=f;ball.style.setProperty('--bc',COLORS[f%COLORS.length]);
    blip(500+t*40,.04,'square',.06);t++},70);
  setTimeout(()=>{
    clearInterval(spin);dr.classList.remove('spin');
    ball.classList.remove('rolling');
    ball.textContent=n;ball.style.setProperty('--bc',COLORS[n%COLORS.length]);
    void ball.offsetWidth;ball.classList.add('drop');
    const h=$('halo');h.classList.remove('go2');void h.offsetWidth;h.classList.add('go2');
    blip(660,.18,'triangle',.18);setTimeout(()=>blip(990,.2,'triangle',.14),90);
    const cl=$('callline');cl.textContent=NICK[n]?NICK[n].e:`Number ${n}`;
    cl.classList.remove('in');void cl.offsetWidth;cl.classList.add('in');
    speak(n);
    if(ticket&&ticket.flat().includes(n))burst(14,7);
    drawTrail();drawBoard();drawTicket();drawClaims();
    broadcastProgress();updateMainBtn();
    rolling=false},900);
}

let gap=6500;
function startAuto(){clearInterval(timer);timer=setInterval(pickNumber,gap)}
function stopAuto(){clearInterval(timer);timer=null;running=false;
  if(started||solo)updateMainBtn()}

function syncModeUI(){
  const canCall=isHost||solo;
  $('gseg').style.display=canCall?'flex':'none';
  $('glangrow').style.display=canCall?'flex':'none';
  $('gspeedBox').style.display=canCall&&mode==='auto'?'block':'none';
  const sb=$('speedBox');if(sb)sb.style.display=mode==='auto'?'block':'none';
  $('main').style.display=canCall?'block':'none';
  $('gAuto').setAttribute('aria-pressed',mode==='auto');
  $('gHost').setAttribute('aria-pressed',mode!=='auto');
  $('mAuto').setAttribute('aria-pressed',mode==='auto');
  $('mHost').setAttribute('aria-pressed',mode!=='auto');
}

/* --- claims --- */
async function claim(p){
  if(!ticket)return;
  if(!called.size){toast('Nothing called yet',true);buzz();return}
  if(claims[p.id]){toast('Already taken',true);return}
  if(p.id==='jaldi5'){
    const good=[...marked].filter(n=>called.has(n)).length;
    if(good<5){toast(`Only ${good} correct marks — bogey!`,true);bogey();return}
  }else{
    const req=need(p.id),miss=req.filter(n=>!called.has(n));
    if(miss.length){toast(`Bogey! ${miss.length} still in the bag`,true);bogey();return}
    const un=req.filter(n=>!marked.has(n));
    if(un.length){toast('Mark them on your ticket first',true);buzz();return}
  }
  if(solo){
    claims[p.id]={by:me.id,name:me.name};
    announce(p,claims[p.id]);
    drawClaims();drawWonStrip();return;
  }
  /* first write wins */
  const res=await fx.runTransaction(R(`rooms/${room}/claims/${p.id}`),cur=>
    cur===null?{by:me.id,name:me.name,at:Date.now()}:undefined);
  if(!res.committed){toast('Someone beat you to it!',true);buzz()}
  else log('claimed '+p.id);
}
function bogey(){buzz();document.body.classList.add('shake');
  setTimeout(()=>document.body.classList.remove('shake'),500)}

/* ==========================================================
   7. WIRING
   ========================================================== */
$('bHost').onclick=()=>{ac();hostGame().catch(e=>{log('host fail '+e.message,true);toast('Could not create room',true)})};
$('bJoin').onclick=()=>{ac();joinGame().catch(e=>{log('join fail '+e.message,true);toast('Could not join',true)})};
$('bSolo').onclick=()=>{ac();solo=true;isHost=true;started=true;me.name='You';
  ticket=newTicket();called=new Set();marked=new Set();claims={};beginGame()};
function preview(){
  if(running||rolling)return;            /* never talk over a live call */
  const s=sound;sound=true;speak(88);sound=s;
}
$('lHi').onclick=()=>{setLang('hi',true);preview()};
$('lEn').onclick=()=>{setLang('en',true);preview()};
$('gHi').onclick=()=>{setLang('hi',true);toast('Hindi calls from the next number')};
$('gEn').onclick=()=>{setLang('en',true);toast('English calls from the next number')};
$('bLock').onclick=()=>toggleLock().catch(e=>log('lock fail '+e.message,true));
$('bStart').onclick=()=>startGame().catch(e=>log('start fail '+e.message,true));
$('bLeave').onclick=leave;
$('bQuit').onclick=leave;

$('bShare').onclick=async()=>{
  const url=location.origin+location.pathname+'?room='+room;
  const text=`Housie khelein! Room code: ${room}\n${url}`;
  if(navigator.share){try{await navigator.share({title:'Housie Night',text})}catch(e){}}
  else{try{await navigator.clipboard.writeText(text);toast('Invite copied!')}catch(e){toast(room)}}
};

function setGap(secs,push){
  gap=Math.max(3,Math.min(20,secs))*1000;
  const s=Math.round(gap/1000);
  ['speed','gspeed'].forEach(id=>{const el=$(id);if(el)el.value=s});
  ['speedVal','gspeedVal'].forEach(id=>{const el=$(id);if(el)el.textContent=s+'s'});
  if(running&&mode==='auto')startAuto();
  if(push&&!solo&&room&&isHost)fx.set(R(`rooms/${room}/gap`),s).catch(()=>{});
}
['speed','gspeed'].forEach(id=>{
  const el=$(id);
  el.oninput=e=>{
    const s=+e.target.value;
    ['speedVal','gspeedVal'].forEach(v=>$(v).textContent=s+'s');
  };
  el.onchange=e=>setGap(+e.target.value,true);
});

let running=false;

function updateMainBtn(){
  const b=$('main');
  const left=90-called.size;
  if(left===0){b.textContent='All numbers called';b.disabled=true;return}
  b.disabled=false;
  if(mode==='host'){
    b.textContent=called.size?'Call next number':'Call first number';
    return;
  }
  if(running)b.textContent='Pause';
  else b.textContent=called.size?'Resume':'Start calling';
}

function setMode(m){
  mode=m;syncModeUI();
  if(!solo&&isHost&&room)fx.set(R(`rooms/${room}/mode`),m).catch(()=>{});
  stopAuto();
  if(m==='auto'&&running)startAuto();
  updateMainBtn();
}
$('mAuto').onclick=()=>setMode('auto');
$('mHost').onclick=()=>setMode('host');
$('gAuto').onclick=()=>setMode('auto');
$('gHost').onclick=()=>setMode('host');

$('main').onclick=()=>{
  ac();
  if(mode==='host'){pickNumber();updateMainBtn();return}
  if(running){running=false;stopAuto()}
  else{running=true;pickNumber();startAuto()}
  updateMainBtn();
};

$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';
  if(!sound&&window.speechSynthesis)speechSynthesis.cancel()};
$('voice').onchange=e=>{voiceManual=true;voice=voices[e.target.value];preview()};

$('codeIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};

/* prefill room code from a shared link */
const qs=new URLSearchParams(location.search).get('room');
if(qs){$('codeIn').value=qs.toUpperCase().slice(0,4);log('code from link: '+qs)}

drum();
log('ready');
</script>
